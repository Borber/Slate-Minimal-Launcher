name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # This repository has wrapper properties but no gradlew script or wrapper JAR.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      # Fork PRs and Dependabot runs cannot access repository secrets. They build an
      # unsigned release; trusted runs restore the key and upload a signed release.
      - name: Restore release signing files
        id: signing
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES_BASE64: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PROPERTIES_BASE64" ]]; then
            echo '::error::Set RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PROPERTIES_BASE64 repository secrets.'
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          printf '%s' "$RELEASE_KEYSTORE_PROPERTIES_BASE64" | base64 --decode > keystore.properties
          test -s app/release.keystore
          test -s keystore.properties

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - name: Verify release signature
        if: steps.signing.outcome == 'success'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/*.apk

      - name: Upload signed release APK
        if: steps.signing.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: slate-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        if: steps.signing.outcome == 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: slate-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
